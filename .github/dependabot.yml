# Keeps the pinned GitHub Actions (commit SHAs) and the Cargo dependencies current.
# Dependabot rewrites the SHA and the version comment together, one PR per update.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      cargo:
        patterns: ["*"]
