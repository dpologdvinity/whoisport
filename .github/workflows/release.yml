name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  # Check the tag, test, and create a DRAFT release once; build jobs only upload to it.
  # Nothing is public (GitHub release, Scoop, PyPI, npm) until every build has succeeded.
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "v$version" = "$TAG" ] || { echo "tag $TAG does not match Cargo.toml version $version"; exit 1; }
      - run: cargo test
      - env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
  build:
    needs: create
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo install cross --locked --version 0.2.5
      - run: cross build --release --target ${{ matrix.target }}
      - run: cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1
      - env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "whoisport-$TAG-$TARGET.tar.gz" -C "target/$TARGET/release" whoisport
          # .deb / .rpm from the same static binary (no extra build).
          deb=$(cargo deb --no-build --no-strip --target "$TARGET")
          cargo generate-rpm --target "$TARGET"
          gh release upload "$TAG" "whoisport-$TAG-$TARGET.tar.gz" "$deb" target/"$TARGET"/generate-rpm/*.rpm --clobber
  macos:
    needs: create
    permissions:
      contents: write
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf "whoisport-$TAG-$TARGET.tar.gz" -C "target/$TARGET/release" whoisport
          gh release upload "$TAG" "whoisport-$TAG-$TARGET.tar.gz" --clobber
  windows:
    needs: create
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $zip = "whoisport-$env:TAG-x86_64-pc-windows-msvc.zip"
          Compress-Archive -Path target/x86_64-pc-windows-msvc/release/whoisport.exe -DestinationPath $zip
          gh release upload $env:TAG $zip --clobber
  # PyPI: wheels that just contain the binary (see pyproject.toml).
  pypi-wheels:
    needs: create
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist
  pypi-sdist:
    needs: create
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist
  # Final gate: all builds succeeded -> publish the release, then update Scoop.
  publish:
    needs: [build, macos, windows, pypi-wheels, pypi-sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false
      # Point the Scoop bucket (bucket/whoisport.json on master) at the new zip,
      # unless this is a re-run of an older tag (that would downgrade it).
      - env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(gh release view --repo "$REPO" --json tagName -q .tagName)" = "$TAG" ] || { echo "$TAG is not the latest release; leaving Scoop alone"; exit 0; }
          zip="whoisport-$TAG-x86_64-pc-windows-msvc.zip"
          gh release download "$TAG" --repo "$REPO" -p "$zip"
          hash=$(sha256sum "$zip" | cut -d' ' -f1)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin master && git checkout -q -B master origin/master
            jq --arg v "${TAG#v}" --arg u "https://github.com/$REPO/releases/download/$TAG/$zip" --arg h "$hash" \
              '.version = $v | .architecture."64bit".url = $u | .architecture."64bit".hash = $h' bucket/whoisport.json > m.json
            mv m.json bucket/whoisport.json
            git diff --quiet bucket/whoisport.json && { echo "Scoop manifest already current"; exit 0; }
            git commit -q -am "Update Scoop manifest to $TAG"
            git push -q origin master && exit 0
            echo "push raced with another commit (attempt $attempt); retrying"
          done
          exit 1
  pypi-publish:
    needs: publish
    runs-on: ubuntu-latest
    # PyPI trusted publishing: no token; PyPI trusts this repo + workflow + environment.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
  # npm (also pnpm, yarn, bun): a launcher package plus one package per platform binary.
  # Publishes with npm trusted publishing (OIDC): no token is stored anywhere.
  npm:
    needs: publish
    # Off until trusted publishing is set up for every package on npmjs.com;
    # then set the repository variable NPM_PUBLISH to "true".
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -D assets -p '*.tar.gz' -p '*.zip'
          node npm/build.mjs "${TAG#v}" assets dist
          # Platform packages first, so the launcher's optional dependencies exist.
          for dir in dist/whoisport-*/ dist/whoisport/; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@${TAG#v}" version >/dev/null 2>&1; then
              echo "$name@${TAG#v} already published"; continue
            fi
            (cd "$dir" && npm publish --provenance --access public)
          done
