name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo install cross --locked
      - run: cross build --release --target ${{ matrix.target }}
      - env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: tar -czf "whoisport-$TAG-$TARGET.tar.gz" -C "target/$TARGET/release" whoisport
      - uses: softprops/action-gh-release@v3
        with:
          files: whoisport-*.tar.gz
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - env:
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: Compress-Archive -Path target/x86_64-pc-windows-msvc/release/whoisport.exe -DestinationPath "whoisport-$env:TAG-x86_64-pc-windows-msvc.zip"
      - uses: softprops/action-gh-release@v3
        with:
          files: whoisport-*.zip
