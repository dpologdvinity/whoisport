name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo install cross --locked
      - run: cross build --release --target ${{ matrix.target }}
      - env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: tar -czf "whoisport-$TAG-$TARGET.tar.gz" -C "target/$TARGET/release" whoisport
      - uses: softprops/action-gh-release@v3
        with:
          files: whoisport-*.tar.gz
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: tar -czf "whoisport-$TAG-$TARGET.tar.gz" -C "target/$TARGET/release" whoisport
      - uses: softprops/action-gh-release@v3
        with:
          files: whoisport-*.tar.gz
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - env:
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: Compress-Archive -Path target/x86_64-pc-windows-msvc/release/whoisport.exe -DestinationPath "whoisport-$env:TAG-x86_64-pc-windows-msvc.zip"
      - uses: softprops/action-gh-release@v3
        with:
          files: whoisport-*.zip
      # Point the Scoop bucket (bucket/whoisport.json on master) at the new zip.
      - env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $zip = "whoisport-$env:TAG-x86_64-pc-windows-msvc.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          git fetch origin master
          git checkout master
          $m = Get-Content bucket/whoisport.json -Raw | ConvertFrom-Json
          $m.version = $env:TAG.TrimStart('v')
          $m.architecture.'64bit'.url = "https://github.com/$env:REPO/releases/download/$env:TAG/$zip"
          $m.architecture.'64bit'.hash = $hash
          $m | ConvertTo-Json -Depth 5 | Set-Content bucket/whoisport.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update Scoop manifest to $env:TAG"
          git push origin master
