[package]
name = "whoisport"
version = "0.5.2"
edition = "2024"
rust-version = "1.95" # sysinfo (Windows, macOS) needs 1.95
description = "Show what is listening on a TCP or UDP port, and optionally kill it"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dpologdvinity/whoisport"
authors = ["Kaitlyn Bassford"]
keywords = ["port", "process", "cli", "lsof", "devtools"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["demo.gif", "demo.tape", ".github", "bucket", "pyproject.toml", "npm"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"

# Lets `cargo binstall whoisport` fetch the prebuilt release binaries.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

# Debian/Ubuntu package (`cargo deb`), attached to each GitHub release.
[package.metadata.deb]
maintainer = "Kaitlyn Bassford"
section = "utils"
extended-description = "Lists every listening TCP or UDP port with the process behind it (command line, working directory, user, uptime), shows details for specific ports, and can ask the process to exit or terminate it."
assets = [
    ["target/release/whoisport", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/whoisport/README.md", "644"],
]

# Fedora/RHEL package (`cargo generate-rpm`), attached to each GitHub release.
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/whoisport", dest = "/usr/bin/whoisport", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/whoisport/README.md", mode = "644", doc = true },
]

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "user"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
