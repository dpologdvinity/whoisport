[package]
name = "whoisport"
version = "0.4.0"
edition = "2024"
description = "Show what is listening on a TCP or UDP port, and optionally kill it"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dpologdvinity/whoisport"
authors = ["Kaitlyn Bassford"]
keywords = ["port", "process", "cli", "lsof", "devtools"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["demo.gif", "demo.tape", ".github", "bucket"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"

# Lets `cargo binstall whoisport` fetch the prebuilt release binaries.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "user"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
