[package]
name = "whoisport"
version = "0.1.0"
edition = "2024"
description = "Show what is listening on a TCP port, and optionally kill it"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dpologdvinity/whoisport"
authors = ["Kaitlyn Bassford"]
keywords = ["port", "process", "cli", "lsof", "devtools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
